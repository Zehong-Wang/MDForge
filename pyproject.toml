[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdforge"
version = "0.0.1"
description = "MDForge: an LLM agent for autonomous molecular-dynamics pipeline design under sparse simulator feedback."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

# The code imports `src` as a top-level package (from src.X import ...), so
# discover packages from the repo root and include the `src` tree.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
